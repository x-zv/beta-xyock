<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계산기 - xyock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .calculator { width: 100%; max-width: 360px; padding: 20px; }
    .display { width: 100%; height: 72px; background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; color: #fff; font-size: 32px; text-align: right; padding: 16px; margin-bottom: 16px; overflow: hidden; white-space: nowrap; overflow-x: auto; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { height: 64px; border: none; border-radius: 10px; background: #1e1e1e; color: #e0e0e0; font-size: 20px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2a2a2a; }
    button.operator { background: #7ae5b3; color: #0a0a0a; font-weight: 600; }
    button.operator:hover { background: #9cf0c4; }
    button.equal { grid-column: span 2; background: #7ae5b3; color: #0a0a0a; font-weight: 600; }
    button.equal:hover { background: #9cf0c4; }
    button.clear { background: #3a3a3a; }
    button.clear:hover { background: #4a4a4a; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>
      <button class="operator" onclick="appendOperator('*')">×</button>
      <button class="operator" onclick="appendOperator('-')">−</button>
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('+')">+</button>
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendDecimal()">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');
    let currentInput = '0';
    let previousInput = null;
    let operator = null;

    function updateDisplay() {
      display.textContent = currentInput;
    }

    function appendNumber(num) {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function clearDisplay() {
      currentInput = '0';
      previousInput = null;
      operator = null;
      updateDisplay();
    }

    function appendOperator(op) {
      if (operator !== null && previousInput !== null) {
        calculate();
      }
      previousInput = currentInput;
      operator = op;
      currentInput = '0';
    }

    function calculate() {
      if (operator === null || previousInput === null) return;
      const prev = parseFloat(previousInput);
      const curr = parseFloat(currentInput);
      let result;
      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/': result = curr !== 0 ? prev / curr : NaN; break;
        default: return;
      }
      if (isNaN(result)) {
        currentInput = '오류';
      } else {
        currentInput = String(result);
      }
      operator = null;
      previousInput = null;
      updateDisplay();
    }
  </script>
</body>
</html>
